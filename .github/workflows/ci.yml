name: CI

on:
  push:
    # 只在分支推送时跑（'**' 匹配所有分支含带斜杠的）；tag 推送不匹配 branches → 不再重复触发。
    # 发版 push 分支 + push tag 曾各触发一次全套 CI，这里让 tag 不再重跑。
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (retry on headless-Chrome launch flake)
        env:
          # 冷 runner 首次拉起 Chrome 偶尔 > 默认超时；显式给足 DevToolsActivePort 落盘时间。
          CHROME_DEVTOOLS_PORT_TIMEOUT_MS: 60000
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm test (attempt ${attempt}/3)"
            if npm test; then
              echo "::endgroup::"
              echo "npm test passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::npm test failed on attempt ${attempt}/3 (retrying if attempts remain)"
            sleep 3
          done
          echo "::error::npm test failed after 3 attempts"
          exit 1
