<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  
  <!-- 搜索图标 -->
  <g transform="translate(64, 64)">
    <!-- 放大镜圆圈 -->
    <circle cx="-8" cy="-8" r="20" fill="none" stroke="white" stroke-width="6"/>
    <!-- 放大镜手柄 -->
    <line x1="8" y1="8" x2="22" y2="22" stroke="white" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 触摸点 -->
    <circle cx="-8" cy="-8" r="3" fill="white"/>
  </g>
  
  <!-- 触摸波纹效果 -->
  <circle cx="56" cy="56" r="8" fill="white" opacity="0.3"/>
  <circle cx="56" cy="56" r="12" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  <circle cx="56" cy="56" r="16" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
</svg>