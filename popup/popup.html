<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>触触搜</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ccs-popup-menu">
    <!-- 头部：显示当前关键词 -->
    <header class="menu-header">
      <div class="header-left">
        <span class="menu-icon">🔍</span>
        <span class="menu-title">触触搜</span>
      </div>
      <div class="menu-keyword-wrap">
        <span class="menu-keyword" id="currentKeyword" title=""></span>
        <button class="menu-keyword-copy" id="currentKeywordCopy" type="button" title="复制关键字到剪贴板" aria-label="复制关键字到剪贴板" hidden>📋</button>
      </div>
    </header>

    <!-- 置顶卡片（封面生成器快捷启动，与 sidepanel pin 同源 storage）：默认隐藏，加载完成有 pin 才显示 -->
    <section class="popup-pin" id="popupPin" hidden>
      <span class="popup-pin-corner-ratio" id="popupPinRatio" title="当前画面比例"></span>
      <button class="popup-pin-action" id="popupPinAction" type="button" title="用当前置顶风格 + 关键字一键生成封面">
        <span class="popup-pin-icon">🎨</span>
        <span class="popup-pin-text">
          <span class="popup-pin-task">封面生成器</span>
          <span class="popup-pin-style" id="popupPinStyle"></span>
        </span>
      </button>
    </section>

    <!-- 菜单容器：动态渲染 -->
    <div class="menu-container" id="menuContainer">
      <div class="menu-loading">加载中...</div>
    </div>

    <!-- 设置面板（默认隐藏） -->
    <div class="settings-panel" id="settingsPanel" style="display: none;">
      <div class="settings-header">
        <button class="back-to-menu" id="backToMenu">← 返回菜单</button>
      </div>

      <div class="settings-content">
        <!-- 快捷操作 -->
        <div class="settings-grid">
          <button class="setting-btn" data-action="toggle">
            <span class="setting-icon">⚡</span>
            <span class="setting-label">启用/禁用</span>
          </button>
          <button class="setting-btn" data-action="blacklist">
            <span class="setting-icon">🚫</span>
            <span class="setting-label">黑名单管理</span>
          </button>
          <button class="setting-btn" data-action="debug">
            <span class="setting-icon">🐞</span>
            <span class="setting-label">调试日志：关</span>
          </button>
          <button class="setting-btn" data-action="voice" title="实验性功能：通过语音说出引擎名快速搜索（默认关）">
            <span class="setting-badge">BETA</span>
            <span class="setting-icon">🎤</span>
            <span class="setting-label">语音功能：关</span>
          </button>
          <button class="setting-btn" data-action="export-menu-state">
            <span class="setting-icon">📋</span>
            <span class="setting-label">导出菜单状态</span>
          </button>
          <button class="setting-btn" data-action="shortcut-settings">
            <span class="setting-icon">⌨️</span>
            <span class="setting-label">快捷键设置</span>
          </button>
          <button class="setting-btn" data-action="prompt-library">
            <span class="setting-icon">📚</span>
            <span class="setting-label">提示词库</span>
          </button>
          <button class="setting-btn" data-action="open-welcome">
            <span class="setting-icon">📖</span>
            <span class="setting-label">查看欢迎页</span>
          </button>
        </div>

        <!-- 黑名单管理区域（默认隐藏） -->
        <div class="blacklist-section" id="blacklistSection" style="display: none;">
          <h3>黑名单管理</h3>
          <div class="blacklist-info">
            <p>已屏蔽 <span class="blacklist-count">0</span> 个网站</p>
            <button class="clear-blacklist">清空全部</button>
          </div>
          <div class="blacklist-list"></div>
          <div class="blacklist-tips">
            恢复：<kbd>Alt+右键</kbd> / <kbd>Alt+S</kbd>
          </div>
        </div>

        <!-- 快捷键设置区域（默认隐藏） -->
        <div class="shortcut-settings-section" id="shortcutSection" style="display: none;">
          <h3>快捷键设置</h3>
          <div class="shortcut-settings">
            <label>切换面板快捷键：</label>
            <select class="shortcut-key-select">
              <option value="Alt+S">Alt+S（默认）</option>
              <option value="Ctrl+Shift+S">Ctrl+Shift+S</option>
              <option value="Alt+Shift+S">Alt+Shift+S</option>
              <option value="Ctrl+Alt+S">Ctrl+Alt+S</option>
              <option value="Alt+Q">Alt+Q</option>
              <option value="Alt+E">Alt+E</option>
            </select>
          </div>
          <button class="save-shortcut">保存设置</button>
        </div>

        <!-- 提示词库区域（默认隐藏） -->
        <div class="prompt-library-section" id="promptLibrarySection" style="display: none;">
          <h3>提示词库</h3>
          <div class="prompt-library-header">
            <p>已保存 <span class="prompt-count">0</span> 个提示词</p>
            <button class="add-prompt-btn">+ 新建</button>
          </div>
          <div class="prompt-list"></div>
          <div class="prompt-library-tips">
            点击提示词复制到剪贴板，跨设备自动同步
          </div>
        </div>

        <!-- 菜单调试区域（默认隐藏） -->
        <div class="menu-debug-section" id="debugSection" style="display: none;">
          <h3>菜单状态调试</h3>
          <div class="menu-debug-info">
            <button class="copy-debug-info">复制到剪贴板</button>
            <button class="close-debug-info">关闭</button>
          </div>
          <div class="menu-debug-content">
            <pre class="menu-debug-text"></pre>
          </div>
        </div>

        <!-- 版本信息 -->
        <div class="version-info">
          <span class="version-label">版本</span>
          <span class="version-number" id="versionNumber">v1.1.1</span>
        </div>
      </div>
    </div>

    <!-- 底部：设置入口 -->
    <footer class="menu-footer">
      <button class="settings-toggle" id="settingsToggle">⚙️ 设置</button>
      <button class="panel-toggle" id="openSidePanel">📑 打开侧边栏</button>
      <a href="https://chuchusou.com" target="_blank" class="footer-link">chuchusou.com</a>
    </footer>
  </div>

  <!-- 提示词新建/编辑模态框 -->
  <div class="prompt-modal" id="promptModal" style="display: none;">
    <div class="prompt-modal-content">
      <h4 id="promptModalTitle">新建提示词</h4>
      <div class="prompt-form">
        <label>
          名称
          <input type="text" id="promptNameInput" maxlength="50" placeholder="提示词名称">
        </label>
        <label>
          内容
          <textarea id="promptContentInput" maxlength="2000" rows="5" placeholder="提示词内容"></textarea>
          <span class="prompt-char-count">0/2000</span>
        </label>
      </div>
      <div class="prompt-modal-actions">
        <button class="prompt-modal-cancel">取消</button>
        <button class="prompt-modal-save">保存</button>
      </div>
    </div>
  </div>

  <script src="modules/ToastHelper.js"></script>
  <script src="modules/MenuRenderer.js"></script>
  <script src="modules/SettingsManager.js"></script>
  <script src="modules/PromptLibraryManager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
