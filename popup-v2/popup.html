<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>触触搜</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <span class="brand">🔍 触触搜</span>
    <span class="kw" id="kw" title=""></span>
    <button class="copy" id="copy" type="button" title="复制关键字" hidden>📋</button>
  </header>

  <!-- 封面生成器快捷启动（用户在侧边栏 pin 过风格才显示）-->
  <section class="pin" id="pin" hidden>
    <button class="pin-btn" id="pinBtn" type="button" title="用当前关键字 + pinned 风格一键生成封面">
      <span class="pin-icon">🎨</span>
      <span class="pin-meta">
        <span class="pin-task">封面生成器</span>
        <span class="pin-style" id="pinStyle">…</span>
      </span>
      <span class="pin-ratio" id="pinRatio" title="画面比例"></span>
    </button>
    <button class="pin-edit" id="pinEdit" type="button" title="到侧边栏改风格 / 比例">📑</button>
  </section>

  <div class="menu" id="menu" role="menu">
    <div class="item" role="menuitem" data-id="ccs-fastqa-chatgpt-quick" data-tpl="https://chatgpt.com/?q=${KW}">
      <span class="icon">🤖</span><span class="label">速答 · ChatGPT</span>
    </div>
    <div class="item" role="menuitem" data-id="ccs-fastqa-claude-quick" data-tpl="https://claude.ai/new?q=${KW}">
      <span class="icon">🧠</span><span class="label">速答 · Claude</span>
    </div>
    <div class="sep"></div>
    <div class="item" role="menuitem" data-id="ccs-baidu" data-tpl="https://www.baidu.com/s?wd=${KW}">
      <span class="icon">🐼</span><span class="label">百度搜索</span>
    </div>
    <div class="item" role="menuitem" data-id="ccs-google" data-tpl="https://www.google.com/search?q=${KW}">
      <span class="icon">🔎</span><span class="label">Google 搜索</span>
    </div>
    <div class="sep"></div>
    <div class="item" role="menuitem" data-id="ccs-chatgpt" data-tpl="https://chatgpt.com/?q=${KW}">
      <span class="icon">🤖</span><span class="label">ChatGPT</span>
    </div>
    <div class="item" role="menuitem" data-id="ccs-claude" data-tpl="https://claude.ai/new?q=${KW}">
      <span class="icon">🧠</span><span class="label">Claude</span>
    </div>
    <div class="item" role="menuitem" data-id="ccs-google-ai-chat" data-tpl="https://www.google.com/search?udm=50&amp;ie=UTF-8&amp;oe=UTF-8&amp;q=${KW}">
      <span class="icon">✨</span><span class="label">Google AI 模式</span>
    </div>
    <div class="sep"></div>
    <div class="item" role="menuitem" data-id="ccs-google-translate" data-tpl="https://translate.google.com/?sl=auto&amp;tl=zh-CN&amp;text=${KW}">
      <span class="icon">🔁</span><span class="label">Google 翻译</span>
    </div>
  </div>

  <!-- 常用 toggle（点一下即生效，不展开二级面板）-->
  <div class="quick" id="quick">
    <button class="q" id="qEnable" type="button" title="启用/禁用扩展（影响悬浮面板、右键菜单）">
      <span class="q-icon">⚡</span><span class="q-label" id="qEnableLabel">已启用</span>
    </button>
    <button class="q" id="qDebug" type="button" title="调试日志开关">
      <span class="q-icon">🐞</span><span class="q-label" id="qDebugLabel">调试关</span>
    </button>
  </div>

  <footer class="ftr">
    <button class="ftr-btn" id="openSP" type="button" title="打开侧边栏（封面生成器 + 完整菜单）">📑 侧边栏</button>
    <a href="../popup/popup.html" target="_blank" rel="noopener" class="legacy" title="黑名单 / 语音 / 提示词库 / 调试导出 / 快捷键 等">⚙️ 高级设置</a>
  </footer>

  <!-- shared utilities (战斗过验证的工具，不是"baseline 风格"): -->
  <!-- logger.js: 统一日志前缀 + debug 开关 -->
  <!-- runtimeClient.js: sendMessage 包装（timeout + retry + lastError 处理）-->
  <!-- keywordClient.js: 关键字获取多层 fallback（storage instant + sendMessage fresh）-->
  <script src="../shared/logger.js"></script>
  <script src="../shared/runtimeClient.js"></script>
  <script src="../shared/keywordClient.js"></script>
  <script src="popup.js"></script>
</body>
</html>
