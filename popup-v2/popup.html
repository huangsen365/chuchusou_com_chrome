<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>触触搜</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <span class="brand">🔍 触触搜</span>
    <span class="kw" id="kw" title=""></span>
    <button class="copy" id="copy" type="button" title="复制关键字" hidden>📋</button>
  </header>

  <!-- 封面生成器快捷启动（用户在侧边栏 pin 过风格才显示）-->
  <section class="pin" id="pin" hidden>
    <button class="pin-btn" id="pinBtn" type="button" title="用当前关键字 + pinned 风格一键生成封面">
      <span class="pin-icon">🎨</span>
      <span class="pin-meta">
        <span class="pin-task">封面生成器</span>
        <span class="pin-style" id="pinStyle">…</span>
      </span>
      <span class="pin-ratio" id="pinRatio" title="画面比例"></span>
    </button>
    <button class="pin-edit" id="pinEdit" type="button" title="到侧边栏改风格 / 比例">📑</button>
  </section>

  <!-- 菜单容器：源码内嵌 8 项作 fallback；build 时 prebuild-popup-menu.mjs 会替换
       为完整 23 项 + 子菜单（百问 / 优化）—— 与旧 popup 同一份 SSoT 来源 -->
  <div class="menu-container" id="menuContainer">
    <div class="menu-item" role="menuitem" data-menu-id="ccs-fastqa-chatgpt-quick" data-menu-type="fastqa-quick" data-engine-id="chatgpt"><span class="item-icon">🤖</span><span class="item-title">速答 · ChatGPT</span></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-fastqa-claude-quick" data-menu-type="fastqa-quick" data-engine-id="claude"><span class="item-icon">🧠</span><span class="item-title">速答 · Claude</span></div>
    <div class="menu-separator"></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-baidu" data-menu-type="search" data-url-pattern="https://www.baidu.com/s?wd=${KEYWORD}"><span class="item-icon">🐼</span><span class="item-title">百度搜索</span></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-google" data-menu-type="search" data-url-pattern="https://www.google.com/search?q=${KEYWORD}"><span class="item-icon">🔎</span><span class="item-title">Google 搜索</span></div>
    <div class="menu-separator"></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-chatgpt" data-menu-type="ai-chat" data-url-pattern="https://chatgpt.com/?q=${KEYWORD}"><span class="item-icon">🤖</span><span class="item-title">ChatGPT</span></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-claude" data-menu-type="ai-chat" data-url-pattern="https://claude.ai/new?q=${KEYWORD}"><span class="item-icon">🧠</span><span class="item-title">Claude</span></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-google-ai-chat" data-menu-type="ai-chat" data-url-pattern="https://www.google.com/search?udm=50&amp;ie=UTF-8&amp;oe=UTF-8&amp;q=${KEYWORD}"><span class="item-icon">✨</span><span class="item-title">Google AI 模式</span></div>
    <div class="menu-separator"></div>
    <div class="menu-item" role="menuitem" data-menu-id="ccs-google-translate" data-menu-type="translate" data-url-pattern="https://translate.google.com/?sl=auto&amp;tl=zh-CN&amp;text=${KEYWORD}"><span class="item-icon">🔁</span><span class="item-title">Google 翻译</span></div>
  </div>

  <!-- 常用 toggle（点一下即生效，不展开二级面板）-->
  <div class="quick" id="quick">
    <button class="q" id="qEnable" type="button" title="启用/禁用扩展（影响悬浮面板、右键菜单）">
      <span class="q-icon">⚡</span><span class="q-label" id="qEnableLabel">已启用</span>
    </button>
    <button class="q" id="qDebug" type="button" title="调试日志开关">
      <span class="q-icon">🐞</span><span class="q-label" id="qDebugLabel">调试关</span>
    </button>
  </div>

  <footer class="ftr">
    <button class="ftr-btn" id="openSP" type="button" title="打开侧边栏（封面生成器 + 完整菜单）">📑 侧边栏</button>
    <a href="../popup/popup.html" target="_blank" rel="noopener" class="legacy" title="黑名单 / 语音 / 提示词库 / 调试导出 / 快捷键 等">⚙️ 高级设置</a>
  </footer>

  <!-- shared utilities (战斗过验证的工具，不是"baseline 风格"): -->
  <!-- logger.js: 统一日志前缀 + debug 开关 -->
  <!-- runtimeClient.js: sendMessage 包装（timeout + retry + lastError 处理）-->
  <!-- keywordClient.js: 关键字获取多层 fallback（storage instant + sendMessage fresh）-->
  <script src="../shared/logger.js"></script>
  <script src="../shared/runtimeClient.js"></script>
  <script src="../shared/keywordClient.js"></script>
  <script src="popup.js"></script>
</body>
</html>
