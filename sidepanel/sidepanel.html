<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>触触搜 Quick Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-header">
    <div class="sp-header-left">
      <span class="sp-icon">🔍</span>
      <span class="sp-title">触触搜</span>
    </div>
    <span class="sp-keyword" id="spKeyword"></span>
  </header>

  <!-- AI 检测提醒（顶部 banner） -->
  <p class="sp-pin-tip"><span class="sp-pin-tip-warn" tabindex="0" aria-label="图片生成后为什么建议截图成新文件">⚠️<span class="sp-pin-tip-popover" role="tooltip"><span class="sp-pin-tip-popover-card"><span class="sp-pin-tip-popover-title">图片生成后，为什么建议截图成新文件？</span><span class="sp-pin-tip-popover-item">1. AI 生成的图片在下载时会自带元数据指纹（C2PA 等），是 AI 内容的"身份证"，小红书、抖音、视频号等平台可一键识别。</span><span class="sp-pin-tip-popover-item">2. 一旦被打上"AI 生成"标签，账号可能面临：<span class="sp-pin-tip-popover-bullets">• 流量限流 / 推荐降权<br>• 强制叠加"AI 生成"水印<br>• 影响商业合作与账号权重</span></span><span class="sp-pin-tip-popover-item">3. 截图重新存成新文件，不携带原指纹，可有效绕过平台的 AI 内容检测。</span><span class="sp-pin-tip-popover-shortcuts">快捷键：Mac ⇧⌘4 · Windows ⊞+Shift+S（或任意截图工具）</span></span></span></span> <span class="sp-pin-tip-text">图片生成后，建议截图成新文件上传自媒体，避免被识别为AI生成</span></p>

  <!-- 置顶快捷动作（默认：封面生成器 · 小红书封面） -->
  <section class="sp-pin" id="spPin" hidden>
    <button class="sp-pin-action" id="spPinAction" type="button">
      <span class="sp-pin-icon" id="spPinIcon">📌</span>
      <span class="sp-pin-text">
        <span class="sp-pin-task" id="spPinTask">封面生成器</span>
        <span class="sp-pin-style" id="spPinStyle"></span>
      </span>
    </button>
    <button class="sp-pin-edit" id="spPinEdit" type="button" title="修改置顶风格" aria-label="修改置顶风格">✏️</button>
  </section>

  <!-- 置顶选择器（默认隐藏，点编辑按钮展开） -->
  <div class="sp-pin-picker" id="spPinPicker" hidden>
    <h3 class="sp-pin-picker-title">选择置顶风格</h3>
    <div class="sp-pin-options" id="spPinOptions"></div>
    <div class="sp-pin-picker-actions">
      <button class="sp-pin-cancel" id="spPinCancel" type="button">取消</button>
      <button class="sp-pin-save" id="spPinSave" type="button">保存</button>
    </div>
  </div>

  <!-- Flat first-level menu items -->
  <div class="sp-menu" id="spMenu">
    <div class="sp-loading">加载中...</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
